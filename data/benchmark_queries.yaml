# RAG-Lab Retrieval Benchmark Queries — v1.8.1 format
#
# Fields per query:
#   id             Unique identifier (used in output)
#   text           The query string
#   category       One of: glossary_definition, technical_standard, cross_lingual_es_en,
#                  multi_chunk_same_doc, multi_doc_synthesis, acronym_or_exact_term,
#                  table_or_structured_reference, negative_no_answer, ambiguity_test,
#                  regression_known_hard
#   language       en | es
#   suite          official | candidate
#   validated      true | false
#   expected_behavior  Brief description of expected retrieval outcome
#   source_of_truth    Primary doc(s) expected to appear in results
#   doc_relevance  Map of doc_id → relevance grade (0-3):
#                    3 = highly relevant (directly answers the question)
#                    2 = relevant (contains related information)
#                    1 = marginally relevant (tangential)
#                    0 / absent = not relevant
#   chunk_relevance  (optional) Map of chunk_id → grade for fine-grained grading
#   notes          Annotation rationale
#
# Suite semantics:
#   official   — fully annotated, validated:true required for CI regression guard
#   candidate  — excluded from official guard; validated:true when ground truth confirmed
#                (negative_no_answer queries stay candidate even when confirmed — their
#                 empty doc_relevance would distort aggregate recall@k metrics)
#
# Current distribution (v1.8.1):
#   official validated:true  = 65 (q001-q033, q035-q042, q048-q072 excluding negatives)
#   candidate validated:true  = 4  (q043-q046 confirmed negatives)
#   candidate validated:false = 3  (q034 MSD acronym, q047 migration, q062 custom type)
#   Total = 72
#
# Docs in corpus:
#   Notas_Tecnicas_SDMX_2.1          — SDMX 2.1 technical notes (ES)
#   SDMX-Training-introduction-2015  — SDMX intro training material (EN)
#   SDMX_2-1_User_Guide_6            — SDMX 2.1 user guide chapter 6 (EN)
#   SDMX_Glossary                    — Official SDMX glossary (EN)
#   SDMX_Glossary_Test               — Small test doc

